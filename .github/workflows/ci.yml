name: CI

# app-ui is consumed as a git submodule by every app with an admin/dashboard shell.
# It gates ITSELF for the same reason barttech-web-core does: a component here that
# is vendored into N repos and linted only as a side effect of being vendored means
# one error reddens N builds at once, against files none of those repos may edit
# (a fix made in a consumer's copy is discarded on the next pointer bump). The gate
# belongs where the source lives. Consumers exclude the vendored path from their
# own lint.
#
# One job, not three: GitHub rounds every job up to a full billed minute
# (see memory/feedback_github_actions_billing.md). This repo is public, so its
# minutes are free — but the estate pattern stays consistent.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:

# This step fetches its gate script from the PUBLIC barttech-web-core repo and
# runs it with node, so whatever that URL returns executes here with access to
# everything in this job. Pinned to a reviewed commit rather than tracking
# main: unpinned, a compromise or a force-push of that one repo would run
# attacker code in every consumer's CI at once, and the blast radius is every
# secret this workflow can see.
#
# The cost is that a script fix no longer reaches this repo on its own —
# bump this SHA to adopt one. That is the trade the integrity buys, and it is
# the right way round: automatic propagation of executable code IS the
# vulnerability.
env:
  WEB_CORE_REF: 10a433b4a4d53a58f9fd14cb38c4b479cd9c0a5b

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `if: always()` so a lint failure never hides a type error — both are
      # reported in one run rather than one masking the other.
      - if: always()
        run: npm run typecheck
      # `contrast.ts` makes a guarantee — that no colour it is handed can produce
      # a sub-AA pair — and a guarantee is only worth what asserts it. Neither
      # lint nor tsc can see a contrast ratio, and the bug this module exists to
      # kill is invisible to a build by definition.
      - if: always()
        run: npm test
      # This repo is vendored read-only into every consumer with an
      # admin/dashboard shell, and the shared gate script skips exactly this
      # directory name when a consumer runs it against its own tree — on the
      # stated assumption that a repo mounted as a vendored submodule gates
      # itself. That assumption was unchecked here until now: this repo had
      # CI, but never actually fetched this gate, so a third-party font load
      # added to a shared component would have shipped, unseen, to every
      # consumer that mounts it. Same rule as everywhere else this gate runs:
      # self-host fonts via next/font or a local file; no runtime request to
      # a third-party font CDN.
      - name: No third-party font CDN loaded at runtime
        if: always()
        run: |
          # >>> third-party-font gate (fetched from barttech-web-core) >>>
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors https://raw.githubusercontent.com/djones007/barttech-web-core/${WEB_CORE_REF}/scripts/check-third-party-fonts.mjs -o /tmp/check-third-party-fonts.mjs
          node /tmp/check-third-party-fonts.mjs
          # <<< third-party-font gate <<<
